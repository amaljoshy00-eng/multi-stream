<!DOCTYPE html>
<html>
<head>
  <title>Multi Stream</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body{
      background:#111;
      color:white;
      font-family:Arial;
      margin:0;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    .light{
      background:white;
      color:black;
    }

    .top-bar{
      padding:10px;
      text-align:center;
    }

    input{
      padding:10px;
      width:60%;
      border:none;
      border-radius:5px;
      outline:none;
    }

    button{
      cursor:pointer;
    }

    /* 🔥 GLOBAL CONTROLS */
    .top-controls{
      position:fixed;
      top:10px;
      right:10px;
      z-index:999;
    }

    .top-controls button{
      background:red;
      color:white;
      border:none;
      padding:8px 12px;
      margin-left:5px;
      border-radius:5px;
      font-weight:bold;
    }

    /* 🔥 GRID */
    .grid{
      display:grid;
      gap:6px;
      flex:1;
      padding:6px;
    }

    .card{
      background:#1c1c1c;
      position:relative;
      overflow:hidden;
      min-height:220px;
      border-radius:8px;
    }

    .minimized{
      height:60px !important;
      min-height:60px !important;
    }

    .player{
      width:100%;
      height:100%;
    }

    iframe{
      width:100% !important;
      height:100% !important;
    }

    /* ❌ DELETE BUTTON */
    .controls{
      position:absolute;
      top:5px;
      right:5px;
      z-index:10;
      display:flex;
      align-items:center;
      gap:4px;
      flex-wrap:wrap;
    }

    .controls button{
      background:red;
      color:white;
      border:none;
      padding:4px 8px;
      border-radius:4px;
      font-size:12px;
      margin-left:4px;
    }

    .volume-slider{
      width:70px;
    }

    /* FOOTER */
    .footer{
      text-align:center;
      padding:8px;
      color:#00e676;
      background:#000;
      font-size:12px;
    }

    /* 📱 MOBILE */
    @media(max-width:900px){

      .grid{
        grid-template-columns:repeat(2,1fr) !important;
      }

    }

    @media(max-width:600px){

      .grid{
        grid-template-columns:1fr !important;
      }

      input{
        width:90%;
      }

      .top-controls{
        top:auto;
        bottom:10px;
        right:10px;
      }

    }

  </style>
</head>

<body>

<div class="top-bar">

  <h2>🔥 Multi Stream (9 max)</h2>

  <input id="link" placeholder="Paste YouTube link">

  <button onclick="addStream()">Add</button>

  <h3>🟢 Online: <span id="viewerCount">0</span></h3>

</div>

<!-- 🔥 PLAY / PAUSE -->
<div class="top-controls">

  <button onclick="playAll()">▶ Play</button>

  <button onclick="pauseAll()">⏸ Pause</button>

  <button onclick="toggleTheme()">🌙</button>

</div>

<!-- 🎥 GRID -->
<div class="grid" id="grid"></div>

<div class="footer">
  Developed by Amal Joshy
</div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<!-- 🔥 YOUTUBE API -->
<script src="https://www.youtube.com/iframe_api"></script>

<!-- 🔥 SORTABLE -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script>

const firebaseConfig = {

  apiKey: "AIzaSyBTPrDoxWQdEWLLHsUuJbv4cQX1vUd6lQY",

  authDomain: "multi-stream-ddb1d.firebaseapp.com",

  databaseURL: "https://multi-stream-ddb1d-default-rtdb.firebaseio.com",

  projectId: "multi-stream-ddb1d",

  appId: "1:305282777189:web:50adf19c4bbb1c8005c68c"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


// 🔥 YOUTUBE API READY
let apiReady = false;

function onYouTubeIframeAPIReady() {

  apiReady = true;

}


// 🔥 STORE PLAYERS
let players = {};


// 👤 REAL ONLINE TRACKING
const userId = Math.random().toString(36).substring(2);

const userRef = db.ref("users/" + userId);

db.ref(".info/connected").on("value", snap => {

  if (snap.val() === true) {

    userRef.set(true);

    userRef.onDisconnect().remove();

  }

});


// 🟢 ONLINE COUNT
db.ref("users").on("value", snap => {

  document.getElementById("viewerCount").innerText =
    snap.numChildren();

});


// 🎥 LOAD STREAMS
db.ref("streams").on("value", snap => {

  const grid = document.getElementById("grid");


  // 🔥 DESTROY OLD PLAYERS
  Object.values(players).forEach(player => {

    if(player.destroy){

      player.destroy();

    }

  });

  players = {};

  grid.innerHTML = "";


  let count = snap.numChildren();

  updateGrid(count);


  snap.forEach(child => {

    createPlayer(child.val(), child.key);

  });

});


// ➕ ADD STREAM
function addStream() {

  let url = document.getElementById("link").value.trim();

  let id = getId(url);

  if (!id) {

    alert("Invalid YouTube link");

    return;

  }

  db.ref("streams").once("value", snap => {

    // 🔥 LIMIT
    if (snap.numChildren() >= 9) {

      alert("Maximum 9 streams allowed");

      return;

    }

    // 🔥 PREVENT DUPLICATES
    let exists = false;

    snap.forEach(child => {

      if (child.val() === id) {

        exists = true;

      }

    });

    if (exists) {

      alert("Stream already added");

      return;

    }

    db.ref("streams").push(id);

    document.getElementById("link").value = "";

  });

}


// 🎬 CREATE PLAYER
function createPlayer(id, key) {

  if (!apiReady) {

    setTimeout(() => {

      createPlayer(id, key);

    }, 500);

    return;

  }

  const grid = document.getElementById("grid");

  let div = document.createElement("div");

  div.className = "card";


  // 🔥 PLAYER CONTAINER
  let playerDiv = document.createElement("div");

  playerDiv.className = "player";

  playerDiv.id = "player-" + key;

  div.appendChild(playerDiv);


  // ❌ CONTROLS
  let controls = document.createElement("div");

  controls.className = "controls";


  // 🔊 VOLUME
  let volume = document.createElement("input");

  volume.type = "range";

  volume.min = 0;

  volume.max = 100;

  volume.value = 100;

  volume.className = "volume-slider";

  volume.oninput = () => {

    let player = players[key];

    if(player && player.setVolume){

      player.setVolume(volume.value);

    }

  };

  controls.appendChild(volume);


  // 🌙 PIP
  let pipBtn = document.createElement("button");

  pipBtn.innerText = "PiP";

  pipBtn.onclick = async () => {

    try {

      const iframe =
        document.querySelector(`#player-${key} iframe`);

      if (document.pictureInPictureElement) {

        await document.exitPictureInPicture();

      }

    } catch(err){

      console.log(err);

    }

  };

  controls.appendChild(pipBtn);


  // 🔥 FULLSCREEN
  let fullscreenBtn = document.createElement("button");

  fullscreenBtn.innerText = "⛶";

  fullscreenBtn.onclick = () => {

    if (!document.fullscreenElement) {

      div.requestFullscreen();

    } else {

      document.exitFullscreen();

    }

  };

  controls.appendChild(fullscreenBtn);


  // ➖ MINIMIZE
  let minBtn = document.createElement("button");

  minBtn.innerText = "—";

  minBtn.onclick = () => {

    div.classList.toggle("minimized");

  };

  controls.appendChild(minBtn);


  // ⭐ FAVORITE
  let favBtn = document.createElement("button");

  favBtn.innerText = "⭐";

  favBtn.onclick = () => {

    let favs =
      JSON.parse(localStorage.getItem("favorites") || "[]");

    if(!favs.includes(id)){

      favs.push(id);

    }

    localStorage.setItem("favorites", JSON.stringify(favs));

    alert("Added to favorites");

  };

  controls.appendChild(favBtn);


  // ❌ DELETE
  let btn = document.createElement("button");

  btn.innerText = "X";

  btn.onclick = () => {

    db.ref("streams/" + key).remove();

  };

  controls.appendChild(btn);

  div.appendChild(controls);

  grid.appendChild(div);


  // 🔥 REAL YOUTUBE PLAYER
  players[key] = new YT.Player(playerDiv.id, {

    width: "100%",

    height: "100%",

    videoId: id,

    playerVars: {

      autoplay: 1,

      mute: 1,

      controls: 1,

      playsinline: 1,

      enablejsapi: 1,

      origin: window.location.origin,

      rel: 0

    },

    events: {

      onReady: function(event){

        event.target.playVideo();

      }

    }

  });

}


// ▶ PLAY ALL
function playAll() {

  Object.keys(players).forEach(key => {

    let player = players[key];

    if (
      player &&
      typeof player.playVideo === "function"
    ) {

      try {

        player.playVideo();

      } catch(err) {

        console.log(err);

      }

    }

  });

}


// ⏸ PAUSE ALL
function pauseAll() {

  Object.keys(players).forEach(key => {

    let player = players[key];

    if (
      player &&
      typeof player.pauseVideo === "function"
    ) {

      try {

        player.pauseVideo();

      } catch(err) {

        console.log(err);

      }

    }

  });

}


// 🌙 THEME
function toggleTheme(){

  document.body.classList.toggle("light");

}


// 🔥 SMART GRID
function updateGrid(count){

  const grid = document.getElementById("grid");

  if(count === 1){

    grid.style.gridTemplateColumns = "1fr";

  }

  else if(count <= 4){

    grid.style.gridTemplateColumns = "repeat(2,1fr)";

  }

  else{

    grid.style.gridTemplateColumns = "repeat(3,1fr)";

  }

}


// 🔗 BETTER YOUTUBE ID EXTRACTION
function getId(url) {

  let r =
    /(?:youtube\.com\/(?:watch\?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([^?&#]+)/;

  let m = url.match(r);

  return m ? m[1] : null;

}


// 🔥 DRAG & DROP
new Sortable(document.getElementById("grid"), {

  animation: 150

});

</script>

</body>
</html>
