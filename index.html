<!DOCTYPE html>
<html>
<head>
  <title>Multi Stream</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      background:#111;
      color:white;
      font-family:Arial;
      margin:0;
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    .top-bar{
      padding:10px;
      text-align:center;
    }

    input{
      padding:10px;
      width:60%;
      border:none;
      border-radius:5px;
      outline:none;
    }

    button{
      cursor:pointer;
    }

    /* 🔥 GLOBAL CONTROLS */
    .top-controls{
      position:fixed;
      top:10px;
      right:10px;
      z-index:999;
    }

    .top-controls button{
      background:red;
      color:white;
      border:none;
      padding:8px 12px;
      margin-left:5px;
      border-radius:5px;
      font-weight:bold;
    }

    /* 🔥 GRID */
    .grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      grid-template-rows:repeat(3,1fr);
      gap:6px;
      flex:1;
      padding:6px;
    }

    .card{
      background:#1c1c1c;
      position:relative;
      overflow:hidden;
      min-height:200px;
    }

    iframe{
      width:100%;
      height:100%;
      border:none;
    }

    /* ❌ DELETE BUTTON */
    .controls{
      position:absolute;
      top:5px;
      right:5px;
      z-index:10;
    }

    .controls button{
      background:red;
      color:white;
      border:none;
      padding:4px 8px;
      border-radius:4px;
      font-size:12px;
    }

    /* FOOTER */
    .footer{
      text-align:center;
      padding:8px;
      color:#00e676;
      background:#000;
      font-size:12px;
    }

    /* 📱 MOBILE */
    @media(max-width:900px){

      .grid{
        grid-template-columns:repeat(2,1fr);
      }

    }

    @media(max-width:600px){

      .grid{
        grid-template-columns:1fr;
      }

      input{
        width:90%;
      }

      .top-controls{
        top:auto;
        bottom:10px;
        right:10px;
      }

    }
  </style>
</head>

<body>

<div class="top-bar">

  <h2>🔥 Multi Stream (9 max)</h2>

  <input id="link" placeholder="Paste YouTube link">

  <button onclick="addStream()">Add</button>

  <h3>🟢 Online: <span id="viewerCount">0</span></h3>

</div>

<!-- 🔥 GLOBAL PLAY / PAUSE -->
<div class="top-controls">

  <button onclick="playAll()">▶ Play</button>

  <button onclick="pauseAll()">⏸ Pause</button>

</div>

<!-- 🎥 GRID -->
<div class="grid" id="grid"></div>

<div class="footer">
  Developed by Amal Joshy
</div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>

const firebaseConfig = {

  apiKey: "AIzaSyBTPrDoxWQdEWLLHsUuJbv4cQX1vUd6lQY",

  authDomain: "multi-stream-ddb1d.firebaseapp.com",

  databaseURL: "https://multi-stream-ddb1d-default-rtdb.firebaseio.com",

  projectId: "multi-stream-ddb1d",

  appId: "1:305282777189:web:50adf19c4bbb1c8005c68c"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


// 👤 REAL ONLINE TRACKING
const userId = Math.random().toString(36).substring(2);

const userRef = db.ref("users/" + userId);

db.ref(".info/connected").on("value", snap => {

  if (snap.val() === true) {

    userRef.set(true);

    userRef.onDisconnect().remove();

  }

});


// 🟢 ONLINE COUNT
db.ref("users").on("value", snap => {

  document.getElementById("viewerCount").innerText =
    snap.numChildren();

});


// 🎥 LOAD STREAMS
db.ref("streams").on("value", snap => {

  const grid = document.getElementById("grid");

  grid.innerHTML = "";

  snap.forEach(child => {

    createPlayer(child.val(), child.key);

  });

});


// ➕ ADD STREAM
function addStream() {

  let url = document.getElementById("link").value.trim();

  let id = getId(url);

  if (!id) {

    alert("Invalid YouTube link");

    return;

  }

  db.ref("streams").once("value", snap => {

    // 🔥 LIMIT
    if (snap.numChildren() >= 9) {

      alert("Maximum 9 streams allowed");

      return;

    }

    // 🔥 PREVENT DUPLICATE
    let exists = false;

    snap.forEach(child => {

      if (child.val() === id) {

        exists = true;

      }

    });

    if (exists) {

      alert("Stream already added");

      return;

    }

    db.ref("streams").push(id);

    document.getElementById("link").value = "";

  });

}


// 🎬 CREATE PLAYER
function createPlayer(id, key) {

  const grid = document.getElementById("grid");

  let div = document.createElement("div");

  div.className = "card";


  // 🔥 IFRAME
  let iframe = document.createElement("iframe");

  iframe.src =
    "https://www.youtube.com/embed/" +
    id +
    "?enablejsapi=1&autoplay=1&mute=1&playsinline=1&origin=" +
    window.location.origin;

  iframe.allow = "autoplay";

  div.appendChild(iframe);


  // ❌ DELETE BUTTON
  let controls = document.createElement("div");

  controls.className = "controls";

  let btn = document.createElement("button");

  btn.innerText = "X";

  btn.onclick = () => {

    db.ref("streams/" + key).remove();

  };

  controls.appendChild(btn);

  div.appendChild(controls);

  grid.appendChild(div);

}


// ▶ PLAY ALL
function playAll() {

  document.querySelectorAll("iframe").forEach(frame => {

    frame.contentWindow.postMessage(

      JSON.stringify({
        event: "command",
        func: "playVideo",
        args: []
      }),

      "*"

    );

  });

}


// ⏸ PAUSE ALL
function pauseAll() {

  document.querySelectorAll("iframe").forEach(frame => {

    frame.contentWindow.postMessage(

      JSON.stringify({
        event: "command",
        func: "pauseVideo",
        args: []
      }),

      "*"

    );

  });

}


// 🔗 EXTRACT YOUTUBE ID
function getId(url) {

  let r =
    /(?:youtube\.com.*v=|youtu\.be\/|live\/)([^&#]+)/;

  let m = url.match(r);

  return m ? m[1] : null;

}

</script>

</body>
</html>
