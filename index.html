<!DOCTYPE html>
<html>
<head>
  <title>Advanced Multi Stream</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body{
      background:#111;
      color:white;
      font-family:Arial,sans-serif;
      margin:0;
      height:100vh;
      display:flex;
      flex-direction:column;
      transition:0.3s;
    }

    /* 🌙 LIGHT MODE */
    .light{
      background:#f5f5f5;
      color:#111;
    }

    .light .card{
      background:#ffffff;
    }

    .light .top-bar{
      background:#fff;
    }

    .light .footer{
      background:#ddd;
      color:#111;
    }

    .top-bar{
      padding:12px;
      text-align:center;
      background:#000;
    }

    input{
      padding:10px;
      width:60%;
      border:none;
      border-radius:5px;
      outline:none;
      font-size:15px;
    }

    button{
      cursor:pointer;
    }

    /* 🎛 GLOBAL CONTROLS */
    .top-controls{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      padding:10px;
    }

    .top-controls button{
      background:red;
      color:white;
      border:none;
      padding:8px 14px;
      border-radius:6px;
      font-weight:bold;
    }

    /* 🔥 GRID SELECTOR */
    .grid-selector{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      padding-bottom:10px;
    }

    .grid-selector button{
      background:#222;
      color:white;
      border:none;
      padding:8px 14px;
      border-radius:6px;
      font-weight:bold;
    }

    /* 🔥 GRID */
    .grid{
      display:grid;
      gap:6px;
      flex:1;
      padding:6px;
      transition:0.3s;
    }

    .card{
      background:#1c1c1c;
      position:relative;
      overflow:hidden;
      min-height:240px;
      border-radius:10px;
      transition:0.3s;
    }

    .minimized{
      min-height:70px !important;
      height:70px !important;
    }

    .player{
      width:100%;
      height:100%;
    }

    iframe{
      width:100% !important;
      height:100% !important;
      border:none;
    }

    /* 🎛 CARD CONTROLS */
    .controls{
      position:absolute;
      top:45px;
      left:5px;
      z-index:99999;
      display:flex;
      align-items:center;
      gap:4px;
      flex-wrap:wrap;
      opacity:0;
      transition:0.3s;
    }

    .card:hover .controls{
      opacity:1;
    }

    .controls button{
      background:red;
      color:white;
      border:none;
      padding:4px 8px;
      border-radius:4px;
      font-size:12px;
    }

    .volume-slider{
      width:75px;
    }

    /* ⭐ FAVORITE */
    .favorite{
      background:gold !important;
      color:black !important;
    }

    /* FOOTER */
    .footer{
      text-align:center;
      padding:8px;
      color:#00e676;
      background:#000;
      font-size:12px;
    }

    /* 📱 MOBILE */
    @media(max-width:900px){

      .controls{
        opacity:1;
      }

    }

    @media(max-width:600px){

      .grid{
        grid-template-columns:1fr !important;
      }

      input{
        width:90%;
      }

      .controls{
        top:auto;
        bottom:5px;
      }

    }

  </style>
</head>

<body>

<div class="top-bar">

  <h2>🔥 Advanced Multi Stream</h2>

  <input id="link" placeholder="Paste YouTube link">

  <button onclick="addStream()">Add</button>

  <h3>🟢 Online: <span id="viewerCount">0</span></h3>

</div>

<!-- 🎛 GLOBAL CONTROLS -->
<div class="top-controls">

  <button onclick="playAll()">▶ Play</button>

  <button onclick="pauseAll()">⏸ Pause</button>

  <button onclick="toggleTheme()">🌙 Theme</button>

</div>

<!-- 🔥 GRID SELECTOR -->
<div class="grid-selector">

  <button onclick="setGrid(1)">1 Column</button>

  <button onclick="setGrid(2)">2 Column</button>

  <button onclick="setGrid(3)">3 Column</button>

  <button onclick="enableAutoGrid()">Auto Grid</button>

</div>

<!-- 🎥 GRID -->
<div class="grid" id="grid"></div>

<div class="footer">
  Developed by Amal Joshy
</div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<!-- 🔥 YOUTUBE -->
<script src="https://www.youtube.com/iframe_api"></script>

<!-- 🔥 SORTABLE -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

<script>

const firebaseConfig = {

  apiKey: "AIzaSyBTPrDoxWQdEWLLHsUuJbv4cQX1vUd6lQY",

  authDomain: "multi-stream-ddb1d.firebaseapp.com",

  databaseURL: "https://multi-stream-ddb1d-default-rtdb.firebaseio.com",

  projectId: "multi-stream-ddb1d",

  appId: "1:305282777189:web:50adf19c4bbb1c8005c68c"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


// 🔥 API READY
let apiReady = false;

function onYouTubeIframeAPIReady(){

  apiReady = true;

}


// 🎥 PLAYERS
let players = {};


// 🎛 GRID MODE
let manualGridEnabled = false;


// 👤 ONLINE USERS
const userId = Math.random().toString(36).substring(2);

const userRef = db.ref("users/" + userId);

db.ref(".info/connected").on("value", snap => {

  if(snap.val() === true){

    userRef.set(true);

    userRef.onDisconnect().remove();

  }

});


// 🟢 VIEWERS
db.ref("users").on("value", snap => {

  document.getElementById("viewerCount").innerText =
    snap.numChildren();

});


// 🎥 LOAD STREAMS
db.ref("streams").on("value", snap => {

  const grid = document.getElementById("grid");

  Object.values(players).forEach(player => {

    if(player.destroy){

      player.destroy();

    }

  });

  players = {};

  grid.innerHTML = "";

  if(!manualGridEnabled){

    updateGrid(snap.numChildren());

  }

  snap.forEach(child => {

    createPlayer(child.val(), child.key);

  });

});


// ➕ ADD STREAM
function addStream(){

  let url = document.getElementById("link").value.trim();

  let id = getId(url);

  if(!id){

    alert("Invalid YouTube Link");

    return;

  }

  db.ref("streams").once("value", snap => {

    if(snap.numChildren() >= 9){

      alert("Maximum 9 streams");

      return;

    }

    let exists = false;

    snap.forEach(child => {

      if(child.val() === id){

        exists = true;

      }

    });

    if(exists){

      alert("Stream already exists");

      return;

    }

    db.ref("streams").push(id);

    document.getElementById("link").value = "";

  });

}


// 🎬 CREATE PLAYER
function createPlayer(id,key){

  if(!apiReady){

    setTimeout(() => {

      createPlayer(id,key);

    },500);

    return;

  }

  const grid = document.getElementById("grid");

  let div = document.createElement("div");

  div.className = "card";


  // PLAYER
  let playerDiv = document.createElement("div");

  playerDiv.className = "player";

  playerDiv.id = "player-" + key;

  div.appendChild(playerDiv);


  // 🎛 CONTROLS
  let controls = document.createElement("div");

  controls.className = "controls";


  // 🔊 VOLUME
  let volume = document.createElement("input");

  volume.type = "range";

  volume.min = 0;

  volume.max = 100;

  volume.value = 100;

  volume.className = "volume-slider";

  volume.oninput = () => {

    let player = players[key];

    if(player && player.setVolume){

      player.setVolume(volume.value);

    }

  };

  controls.appendChild(volume);


  // 🔥 FULLSCREEN
  let fullscreenBtn = document.createElement("button");

  fullscreenBtn.innerText = "⛶";

  fullscreenBtn.onclick = () => {

    if(!document.fullscreenElement){

      div.requestFullscreen();

    }else{

      document.exitFullscreen();

    }

  };

  controls.appendChild(fullscreenBtn);


  // ➖ MINIMIZE
  let minBtn = document.createElement("button");

  minBtn.innerText = "—";

  minBtn.onclick = () => {

    div.classList.toggle("minimized");

  };

  controls.appendChild(minBtn);


  // ⭐ FAVORITE
  let favBtn = document.createElement("button");

  favBtn.innerText = "⭐";

  function updateFavoriteUI(){

    let favs =
      JSON.parse(localStorage.getItem("favorites") || "[]");

    if(favs.includes(id)){

      favBtn.classList.add("favorite");

    }else{

      favBtn.classList.remove("favorite");

    }

  }

  updateFavoriteUI();

  favBtn.onclick = () => {

    let favs =
      JSON.parse(localStorage.getItem("favorites") || "[]");

    if(favs.includes(id)){

      favs = favs.filter(f => f !== id);

    }else{

      favs.push(id);

    }

    localStorage.setItem(
      "favorites",
      JSON.stringify(favs)
    );

    updateFavoriteUI();

  };

  controls.appendChild(favBtn);


  // ❌ DELETE
  let deleteBtn = document.createElement("button");

  deleteBtn.innerText = "X";

  deleteBtn.onclick = () => {

    db.ref("streams/" + key).remove();

  };

  controls.appendChild(deleteBtn);

  div.appendChild(controls);

  grid.appendChild(div);


  // 🔥 YOUTUBE PLAYER
  players[key] = new YT.Player(playerDiv.id, {

    width:"100%",

    height:"100%",

    videoId:id,

    playerVars:{

      autoplay:1,

      mute:1,

      controls:1,

      playsinline:1,

      enablejsapi:1,

      rel:0

    },

    events:{

      onReady:function(event){

        event.target.playVideo();

      }

    }

  });

}


// ▶ PLAY ALL
function playAll(){

  Object.values(players).forEach(player => {

    try{

      player.playVideo();

    }catch(err){}

  });

}


// ⏸ PAUSE ALL
function pauseAll(){

  Object.values(players).forEach(player => {

    try{

      player.pauseVideo();

    }catch(err){}

  });

}


// 🌙 THEME
function toggleTheme(){

  document.body.classList.toggle("light");

}


// 🔥 AUTO SMART GRID
function updateGrid(count){

  const grid = document.getElementById("grid");

  if(count === 1){

    grid.style.gridTemplateColumns = "1fr";

  }

  else if(count === 2){

    grid.style.gridTemplateColumns = "repeat(2,1fr)";

  }

  else if(count === 3){

    grid.style.gridTemplateColumns = "repeat(3,1fr)";

  }

  else if(count === 4){

    grid.style.gridTemplateColumns = "repeat(2,1fr)";

  }

  else{

    grid.style.gridTemplateColumns = "repeat(3,1fr)";

  }

}


// 🎛 MANUAL GRID
function setGrid(cols){

  manualGridEnabled = true;

  const grid = document.getElementById("grid");

  grid.style.gridTemplateColumns =
    `repeat(${cols},1fr)`;

}


// 🔄 ENABLE AUTO GRID
function enableAutoGrid(){

  manualGridEnabled = false;

  updateGrid(
    document.getElementById("grid").children.length
  );

}


// 🔗 GET ID
function getId(url){

  let r =
    /(?:youtube\.com\/(?:watch\?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([^?&#]+)/;

  let m = url.match(r);

  return m ? m[1] : null;

}


// 🔥 DRAG DROP
new Sortable(document.getElementById("grid"), {

  animation:150

});

</script>

</body>
</html>
